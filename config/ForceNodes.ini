; ForceNodes v1.6.1 stable
; Shared native-node service and manual node editing tools.
;
; Recalibration has been removed. The grid is calibrated automatically when
; ForceNodes starts, or uses wire_grid_step_cm when a manual override is set.
;
; Default controls:
;   Ctrl + Numpad 1 = toggle node overlay
;   Ctrl + Numpad 2 = toggle arbitrary force placement
;   Ctrl + Numpad 3 = cycle grid mode OFF / SQUARE
;   Mouse button 4  = create/promote selected node
;   Mouse button 5  = remove highlighted safe simple node
;   Escape          = turn off overlay, force placement, and grid mode
;
; Purple = genuine existing node
; Green  = ordinary native/generated grid target; building connectors generated-only
; Yellow = current add-node target
; Orange = current safe remove-node target

[ForceNodes]
enabled = 1

; Each action has its own complete binding. These replace the old shared
; hotkey_modifier and raw DirectInput-number settings.
bind_overlay = CTRL+NUMPAD8
bind_force = CTRL+NUMPAD9
bind_grid = CTRL+NUMPAD0
bind_add_node = MOUSE4
bind_remove_node = MOUSE5

### NOTE - BIND FORMAT
### Enter one primary key or mouse button, optionally preceded by modifiers.
### Separate every part with a plus sign. Do not use quotes.
### Spaces and letter case are ignored, but the recommended format is uppercase.
###
### Valid examples:
###   NUMPAD1
###   CTRL+NUMPAD1
###   SHIFT+F6
###   CTRL+SHIFT+G
###   ALT+CAPSLOCK
###   MOUSE4
###   CTRL+MOUSE5
###
### Modifier names:
###   CTRL, LCTRL, RCTRL
###   SHIFT, LSHIFT, RSHIFT
###   ALT, LALT, RALT
### Up to three modifiers may be used before one primary input.
###
### Mouse names:
###   MOUSE1, MOUSE2, MOUSE4, MOUSE5
### Aliases also accepted: LMB, RMB, M4, M5, X1, X2
### MOUSE3 is not available through the game's current native input exports.
###
### Letter and number keys:
###   A through Z
###   0 through 9
###
### Numpad keys:
###   NUMPAD0 through NUMPAD9
###   NUMPADENTER, NUMPADPLUS, NUMPADMINUS
###   NUMPADSTAR, NUMPADSLASH, NUMPADPERIOD
###
### Function keys:
###   F1 through F12
###
### Other supported names:
###   ESC, TAB, ENTER, SPACE, CAPSLOCK, BACKSPACE
###   MINUS, EQUALS, LBRACKET, RBRACKET, BACKSLASH
###   SEMICOLON, APOSTROPHE, GRAVE, COMMA, PERIOD, SLASH
###   HOME, END, PAGEUP, PAGEDOWN, INSERT, DELETE
###   UP, DOWN, LEFT, RIGHT, NUMLOCK, SCROLLLOCK, LWIN, RWIN
###
### Use NONE to disable an individual action.
### Escape remains the fixed emergency key for exiting all ForceNodes modes.

wire_default = 0

; Native square-wire model.
; 0 reads the terrain resolution and reproduces the game's native formula:
; grid step = 20000 metres / terrain resolution.
; A manual value of 50 cm or more overrides automatic calibration.
wire_grid_step_cm = 0
wire_grid_origin_x_cm = 0
wire_grid_origin_z_cm = 0

; Vanilla accepts path points within roughly 0.65 m of a wire coordinate.
; Generated candidates are placed exactly on the calculated wire line.
wire_grid_tolerance_cm = 65

; Distinct road and pedestrian backend nodes can share one crosswalk location.
; Such a cluster is rendered as one purple orb and is never removable.
shared_node_guard_cm = 75

; Cursor and overlay behaviour.
selection_radius_cm = 800
overlay_radius_m = 850
minimum_endpoint_clearance_cm = 150

; With grid OFF, convert a free-force target to an existing hidden point only
; when extremely close. This prevents backend points pulling the cursor around.
existing_point_snap_cm = 10

; Marker display.
node_marker_scale_percent = 110
candidate_marker_scale_percent = 62
selected_marker_scale_percent = 95
marker_height_cm = 20
maximum_green_markers = 6000
maximum_purple_markers = 6000

; Compact status outliner on the right side of the screen.
hud_enabled = 1
hud_right_margin_px = 238
hud_vertical_offset_px = -58

; Type-5 path worlds are a separate advanced category. Ordinary road-world
; building entrances are detected by native path classes 10/20 even when this
; remains disabled. Automatic spline control points are filtered from selection.
include_connection_paths = 0

; Advanced: include paths carrying the game's disabled/hidden +0x140 flag.
include_disabled_paths = 0

; Compatibility fallback for older INIs.
include_special_paths = 0

; Shared service diagnostics.
service_log = 1
service_scan_before_main_click = 0
service_scan_on_path_click = 1

; Stable default: OFF. Developer add-ons may enable these optional preview hooks
; only when explicitly required and tested for compatibility.
service_enable_path_preview_hooks = 0
service_native_node_verify_tolerance_cm = 75

; Advanced recovery overrides. Function addresses are signature-scanned when 0.
advanced_cursor_offset = 3948
advanced_raw_cursor_offset = 3960
advanced_tool_name_offset = 54312
advanced_game_root_slot_rva = 10043888
advanced_terrain_offset = 3800
advanced_terrain_resolution_offset = 544
advanced_system_count_offset = 81972
advanced_system_entries_offset = 81976
advanced_system_entry_stride = 80
advanced_font_manager_rva = 10055600
advanced_font_slot_rva = 10043904
advanced_ui_scale_rva = 10035336
advanced_screen_width_rva = 10048140
advanced_screen_height_rva = 10048116
advanced_selected_native_node_offset = 63056
advanced_selected_shared_node_offset = 63120
advanced_render_context_rva = 0
advanced_sphere_mesh_slot_rva = 0
advanced_road_builder_rva = 0
advanced_pedestrian_builder_rva = 0
advanced_native_path_builder_rva = 0
